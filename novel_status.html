<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheet Novel Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151c2c',
                            950: '#0a0f1d'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans p-4 sm:p-8">
    <div class="max-w-3xl mx-auto">
        
        <!-- Header -->
        <header class="mb-8 text-center">
            <div class="inline-flex items-center justify-center p-3 bg-indigo-950 text-indigo-400 rounded-full mb-3 shadow-inner border border-indigo-900/50">
                <i data-lucide="book-open" class="w-8 h-8"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-white">Google Sheet Novel Tracker</h1>
            <p class="text-sm text-slate-400 mt-1">Manage your novel publications directly connected to your Google Sheet.</p>
        </header>

        <!-- Notification / Toast Box -->
        <div id="toast" class="hidden mb-4 p-4 bg-emerald-950/80 border border-emerald-800 text-emerald-300 rounded-xl items-center shadow-lg transition-all">
            <i data-lucide="check-circle" class="w-5 h-5 mr-2 text-emerald-400 flex-shrink-0"></i>
            <span id="toast-message"></span>
        </div>

        <!-- Error Box -->
        <div id="error-box" class="hidden mb-4 p-4 bg-rose-950/80 border border-rose-800 text-rose-300 rounded-xl items-center shadow-lg">
            <i data-lucide="alert-circle" class="w-5 h-5 mr-2 text-rose-400 flex-shrink-0"></i>
            <span id="error-message"></span>
            <button onclick="dismissError()" class="ml-auto text-xs underline font-medium">Dismiss</button>
        </div>

        <!-- Input Section -->
        <div class="bg-slate-900 rounded-2xl shadow-xl border border-slate-800 p-5 mb-6">
            <form id="novel-form" onsubmit="handleAddNovel(event)" class="flex flex-col sm:flex-row gap-3">
                <div class="relative flex-grow">
                    <input
                        type="text"
                        id="novel-input"
                        placeholder="Enter novel name (e.g., The Great Adventure)..."
                        class="w-full pl-4 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-slate-900 text-slate-100 placeholder-slate-500 transition"
                        required
                    />
                </div>
                <button
                    type="submit"
                    id="submit-btn"
                    class="inline-flex items-center justify-center px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl shadow-lg transition active:scale-95"
                >
                    <i data-lucide="plus" class="w-5 h-5 mr-2"></i>
                    Add Novel
                </button>
            </form>
        </div>

        <!-- Search Bar & Refresh -->
        <div class="bg-slate-900 rounded-2xl shadow-xl border border-slate-800 p-4 mb-6 flex gap-3 items-center">
            <div class="relative flex-grow">
                <i data-lucide="search" class="absolute left-4 top-3.5 w-5 h-5 text-slate-500"></i>
                <input
                    type="text"
                    id="search-input"
                    oninput="handleSearch()"
                    placeholder="Search novels by name..."
                    class="w-full pl-12 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-slate-900 text-slate-100 placeholder-slate-500 transition"
                />
            </div>
            <button
                onclick="fetchNovels()"
                title="Refresh from Google Sheet"
                class="p-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700 transition"
            >
                <i id="refresh-icon" data-lucide="refresh-cw" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Novels List -->
        <div class="bg-slate-900 rounded-2xl shadow-xl border border-slate-800 overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-950/50">
                <h2 class="font-semibold text-slate-300">Google Sheet Library</h2>
                <span id="novel-count" class="text-xs px-2.5 py-1 bg-slate-800 text-slate-300 rounded-full font-medium border border-slate-700">
                    0 novels found
                </span>
            </div>

            <div id="loading-state" class="p-12 text-center text-slate-500">Loading from Google Sheet...</div>
            <div id="empty-state" class="hidden p-12 text-center text-slate-500">
                <i data-lucide="book-open" class="w-10 h-10 mx-auto mb-2 opacity-30"></i>
                <p>No novels found matching your search.</p>
            </div>
            <div id="novels-list" class="divide-y divide-slate-800"></div>
        </div>

    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxDk-QQt0Q_KlzjWKVFVynM_sVeUJ9YDFL6ZT2Mzm08Z08VN_cviNmCSQ7UMdUzMIkDiA/exec";

        let novels = [];
        let searchQuery = '';

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            fetchNovels();
        });

        function showToast(message) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            msgEl.textContent = message;
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            setTimeout(() => {
                toast.classList.remove('flex');
                toast.classList.add('hidden');
            }, 3000);
        }

        function showError(message) {
            const errBox = document.getElementById('error-box');
            const errEl = document.getElementById('error-message');
            errEl.textContent = message;
            errBox.classList.remove('hidden');
            errBox.classList.add('flex');
        }

        function dismissError() {
            const errBox = document.getElementById('error-box');
            errBox.classList.remove('flex');
            errBox.classList.add('hidden');
        }

        async function fetchNovels() {
            if (!WEB_APP_URL.startsWith('http')) {
                showError("Please configure your Google Apps Script Web App URL in the HTML code.");
                document.getElementById('loading-state').innerHTML = "Configuration required.";
                return;
            }

            try {
                document.getElementById('loading-state').style.display = 'block';
                const response = await fetch(`${WEB_APP_URL}?action=getNovels`);
                const result = await response.json();
                
                if (result.status === 'success') {
                    novels = result.data || [];
                    renderNovels();
                } else {
                    showError(result.message || "Failed to load novels from Google Sheet.");
                }
            } catch (err) {
                console.error("Fetch error:", err);
                showError("Failed to connect to Google Sheet. Check CORS or URL.");
            } finally {
                document.getElementById('loading-state').style.display = 'none';
            }
        }

        async function handleAddNovel(e) {
            e.preventDefault();
            const input = document.getElementById('novel-input');
            const name = input.value.trim();
            if (!name) return;

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = "Adding...";

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'addNovel',
                        name: name
                    })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    input.value = '';
                    showToast("Novel added to Google Sheet!");
                    fetchNovels();
                } else {
                    showError(result.message || "Failed to add novel.");
                }
            } catch (err) {
                console.error("Add error:", err);
                showError("Failed to submit novel to Google Sheet.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="plus" class="w-5 h-5 mr-2"></i>Add Novel';
                lucide.createIcons();
            }
        }

        async function handleToggleStatus(id, currentStatus) {
            const newStatus = currentStatus === 'Published' ? 'Pending' : 'Published';
            
            novels = novels.map(n => n.id === id ? { ...n, status: newStatus } : n);
            renderNovels();

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'updateStatus',
                        id: id,
                        status: newStatus
                    })
                });
                const result = await response.json();
                if (result.status !== 'success') {
                    showError("Failed to sync status update with Google Sheet.");
                    fetchNovels();
                } else {
                    showToast(`Status updated to ${newStatus}`);
                }
            } catch (err) {
                console.error("Update error:", err);
                showError("Failed to update status.");
                fetchNovels();
            }
        }

        async function handleDeleteNovel(id) {
            if (!confirm("Are you sure you want to delete this novel?")) return;

            // Optimistic update locally
            const previousNovels = [...novels];
            novels = novels.filter(n => n.id !== id);
            renderNovels();

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'deleteNovel',
                        id: id
                    })
                });
                const result = await response.json();
                if (result.status !== 'success') {
                    showError("Failed to delete novel from Google Sheet.");
                    novels = previousNovels; // Revert on failure
                    renderNovels();
                } else {
                    showToast("Novel deleted successfully!");
                }
            } catch (err) {
                console.error("Delete error:", err);
                showError("Failed to delete novel.");
                novels = previousNovels;
                renderNovels();
            }
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-input').value.toLowerCase();
            renderNovels();
        }

        function renderNovels() {
            const listContainer = document.getElementById('novels-list');
            const emptyState = document.getElementById('empty-state');
            const countEl = document.getElementById('novel-count');

            const filtered = novels.filter(novel => 
                novel.name && novel.name.toLowerCase().includes(searchQuery)
            );

            countEl.textContent = `${filtered.length} ${filtered.length === 1 ? 'novel' : 'novels'} found`;

            if (filtered.length === 0) {
                listContainer.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            listContainer.innerHTML = filtered.map(novel => {
                const isPublished = novel.status === 'Published';
                return `
                    <div class="px-6 py-4 flex items-center justify-between hover:bg-slate-850 transition">
                        <span class="font-medium text-slate-200 break-all pr-4">${escapeHtml(novel.name)}</span>
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <button
                                onclick="handleToggleStatus('${novel.id}', '${novel.status}')"
                                class="inline-flex items-center px-3.5 py-1.5 rounded-full text-xs font-semibold transition shadow-sm ${
                                    isPublished 
                                        ? 'bg-emerald-950/80 text-emerald-400 border border-emerald-800 hover:bg-emerald-900' 
                                        : 'bg-amber-950/80 text-amber-400 border border-amber-800 hover:bg-amber-900'
                                }"
                                title="Click to toggle status"
                            >
                                ${isPublished ? 
                                    '<i data-lucide="check-circle" class="w-3.5 h-3.5 mr-1.5 text-emerald-400"></i>Published' : 
                                    '<i data-lucide="clock" class="w-3.5 h-3.5 mr-1.5 text-amber-400"></i>Pending'}
                            </button>
                            <button
                                onclick="handleDeleteNovel('${novel.id}')"
                                class="p-1.5 bg-rose-950/50 hover:bg-rose-900 text-rose-400 rounded-lg border border-rose-900 transition"
                                title="Delete Novel"
                            >
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
            
            lucide.createIcons();
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
